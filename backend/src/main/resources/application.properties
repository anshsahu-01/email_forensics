spring.application.name=emailForensic

# Local development: create a .env file in the project root with values like:
# DATABASE_URL=jdbc:postgresql://host:5432/database
# DB_USERNAME=your_db_user
# DB_PASSWORD=your_db_password
#
# Spring Boot 3.2 supports optional .env property loading with spring.config.import.
spring.config.import=optional:file:.env[.properties]

# Optional VirusTotal URL reputation enrichment. The API key is never hardcoded or returned.
virustotal.api-key=${VIRUSTOTAL_API_KEY:}

# Optional AbuseIPDB IP reputation enrichment. The API key is never hardcoded or returned.
abuseipdb.api-key=${ABUSEIPDB_API_KEY:}

# Database configuration is loaded from environment variables.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Driver and Dialect
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# File Upload Limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Connection Pool Settings for Neon
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000
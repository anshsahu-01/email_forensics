spring.application.name=emailForensic

# Local development: create a .env file in the project root with values like:
# DATABASE_URL=jdbc:postgresql://host:5432/database
# DB_USERNAME=your_db_user
# DB_PASSWORD=your_db_password
#
# Spring Boot 3.2+ supports optional .env property loading with spring.config.import.
spring.config.import=optional:file:.env[.properties]

# Optional VirusTotal URL reputation enrichment. The API key is never hardcoded or returned.
virustotal.api-key=${VIRUSTOTAL_API_KEY:}

# Optional AbuseIPDB IP reputation enrichment. The API key is never hardcoded or returned.
abuseipdb.api-key=${ABUSEIPDB_API_KEY:}

# Optional MaxMind GeoIP2 database path. Points to a local GeoLite2-City.mmdb file.
# If absent or the file is not found, IP geolocation is skipped and fields remain null.
# The .mmdb file must NOT be committed to version control.
maxmind.database-path=${MAXMIND_DB_PATH:}

# Optional MaxMind GeoLite2-ASN database path. Points to a local GeoLite2-ASN.mmdb file.
# If absent or the file is not found, ASN lookup is skipped and fields remain null.
# The .mmdb file must NOT be committed to version control.
maxmind.asn-database-path=${MAXMIND_ASN_DB_PATH:}

# ==========================================
# Database Configuration (Neon Cloud with Safe Fallbacks)
# ==========================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://ep-calm-waterfall-aenjg32o-pooler.c-2.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
spring.datasource.username=${DB_USERNAME:npg_j3dRIurpJvZ8}
spring.datasource.password=${DB_PASSWORD:npg_j3dRIurpJvZ8}

# Driver and Dialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool Settings for Neon Serverless
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000

# ==========================================
# Python FastAPI Microservice Endpoint
# ==========================================
ai.service.url=${AI_SERVICE_URL:http://localhost:8000/api/v1/analyze}

# ==========================================
# File Upload Limits (.eml processing)
# ==========================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB